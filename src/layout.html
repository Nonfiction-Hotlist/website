<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="noindex">
<link rel="canonical" href="{{canonical}}">
<!-- Placeholder styles: readable structure only. Design and branding come later. -->
<style>
  body { margin: 0; font: 17px/1.55 system-ui, sans-serif; color: #111; background: #fff; }
  header, main, footer { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header { padding-block: 16px; border-bottom: 1px solid #ddd; }
  header nav ul { list-style: none; padding: 0; margin: 8px 0; display: flex; flex-wrap: wrap; gap: 4px 20px; }
  header nav ul ul { display: block; margin: 2px 0 0 0; font-size: 15px; }
  img, iframe { max-width: 100%; height: auto; }
  section { padding-block: 24px; border-bottom: 1px dashed #ddd; }
  .button { display: inline-block; padding: 8px 16px; border: 1px solid #111; border-radius: 4px; text-decoration: none; color: inherit; }
  .marquee { text-transform: uppercase; letter-spacing: .06em; }
  .faq details { border-top: 1px solid #ddd; padding: 8px 0; }
  .faq summary { cursor: pointer; font-weight: 600; }
  .embed iframe { width: 100%; height: 720px; border: 1px solid #ddd; }
  .news-list { list-style: none; padding: 0; }
  .news-list li { display: grid; grid-template-columns: minmax(0, 160px) minmax(0, 1fr); gap: 16px; padding: 16px 0; border-top: 1px solid #ddd; }
  .news-list h2 { margin: 0; font-size: 20px; }
  .form label { display: block; margin-top: 10px; }
  .form input, .form textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
  .form button { margin-top: 12px; }
  .note { color: #666; font-size: 14px; }
  footer { margin-top: 40px; padding-block: 24px; border-top: 1px solid #ddd; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  footer h2 { font-size: 15px; margin: 0 0 6px; }
  footer ul { list-style: none; padding: 0; margin: 0; }
</style>
</head>
<body>
<header>
  <a href="/">{{site}}</a>
  <nav aria-label="Main">{{nav}}</nav>
</header>
<main>
{{main}}
</main>
<footer>
{{footer}}
</footer>
</body>
</html>
