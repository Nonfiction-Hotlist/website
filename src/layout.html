<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="noindex">
<link rel="canonical" href="{{canonical}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap">
<!-- A first, plain design from the Hotlist list pages: two greens, white text, League Spartan and Literata. -->
<style>
  :root {
    --forest: #2e4a3b; --deep: #22382c; --sage: #9aab8c; --soft: #c6d0bb; --cream: #ebe6d7; --ink: #1d2b23;
    --text: #ffffff; --muted: rgba(255, 255, 255, 0.7); --line: rgba(255, 255, 255, 0.18);
    --display: "League Spartan", "Futura", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    --body: "Literata", "Iowan Old Style", Georgia, serif;
    --wrap: 1180px; --gutter: max(20px, calc((100% - var(--wrap)) / 2));
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--forest); color: var(--text); font: 18px/1.6 var(--body); }
  a { color: inherit; text-underline-offset: 3px; }
  a:hover { color: var(--soft); }
  img, iframe { max-width: 100%; height: auto; }
  img { border-radius: 4px; display: block; }
  h1, h2, h3, h4 { font-family: var(--display); line-height: 1.05; letter-spacing: -0.01em; margin: 0 0 0.5em; }
  h1 { font-size: clamp(2.4rem, 1.6rem + 3.6vw, 4.4rem); font-weight: 800; }
  h2 { font-size: clamp(1.8rem, 1.3rem + 2vw, 2.8rem); font-weight: 700; }
  h3 { font-size: 1.35rem; font-weight: 700; }
  h4 { font-size: 1.1rem; font-weight: 600; }
  p, ul, ol { margin: 0 0 1em; max-width: 42em; }

  /* Bands: each section of a page alternates between the two greens */
  main section { padding: clamp(40px, 6vw, 80px) var(--gutter); }
  main section:nth-of-type(even) { background: var(--deep); }
  main > :not(section) { padding-inline: var(--gutter); }
  main > article { padding-block: clamp(40px, 6vw, 80px); }
  section img, article img { margin: 0 0 1.2em; max-height: 640px; object-fit: cover; }

  /* A band with a background video (Squarespace's home page hero): the video fills the band, nearly a
     screen tall; the section's content sits in a thin white frame over it, at the lower left. */
  main section.has-video { position: relative; overflow: hidden; min-height: min(calc(100svh - 74px), 62vw); padding: clamp(14px, 2.2vw, 28px);
    display: flex; background-color: var(--deep); background-size: cover; background-position: center; }
  .bg-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .has-video .frame { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
    border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 12px; padding: clamp(24px, 6vw, 80px); }
  .has-video .frame img { width: min(62vw, 780px); max-height: none; margin: 0; border-radius: 0; filter: drop-shadow(0 2px 18px rgba(0, 0, 0, 0.25)); }
  .has-video .frame > :last-child { margin-bottom: 0; }
  @media (max-width: 640px) { main section.has-video { min-height: calc(100svh - 150px); } .has-video .frame img { width: 100%; } }
  /* Less motion: the first frame stays as a still picture (the band's background) instead of the video. */
  @media (prefers-reduced-motion: reduce) { .bg-video { display: none; } }

  .button { display: inline-block; margin: 0.4em 0 1em; padding: 12px 24px; border-radius: 999px; background: var(--cream); color: var(--ink);
    font-family: var(--display); font-weight: 600; font-size: 1rem; text-decoration: none; }
  .button:hover { background: var(--soft); color: var(--ink); }
  .marquee { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sage); font-size: 1.1rem; max-width: none; }

  .faq { max-width: 46em; border-bottom: 1px solid var(--line); margin-bottom: 1.5em; }
  .faq details { border-top: 1px solid var(--line); padding: 14px 0; }
  .faq summary { cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 1.1rem; }
  .faq details p { margin: 10px 0 0; color: var(--muted); }

  .embed iframe { width: 100%; height: 760px; border: 0; border-radius: 6px; background: #fff; }
  .embed p { font-size: 0.9rem; color: var(--muted); }

  .news-list { list-style: none; padding: 0; max-width: none; }
  .news-list li { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 24px; padding: 28px 0; border-top: 1px solid var(--line); }
  .news-list img { margin: 0; }
  .news-list time { font-family: var(--display); font-size: 0.9rem; color: var(--muted); }
  .news-list h2 { font-size: 1.6rem; margin: 4px 0 8px; }
  .news-list h2 a { text-decoration: none; }
  .news-list p { color: var(--muted); }
  article time { display: block; font-family: var(--display); color: var(--muted); margin-bottom: 1.5em; }

  .form { max-width: 34em; }
  .form label { display: block; margin: 14px 0 6px; font-family: var(--display); font-weight: 600; font-size: 0.95rem; }
  .form input, .form textarea { width: 100%; padding: 12px 14px; border: 0; border-radius: 6px; background: var(--cream); color: var(--ink); font: inherit; font-size: 1rem; }
  .form textarea { min-height: 120px; }
  .form button { margin-top: 18px; padding: 12px 24px; border: 0; border-radius: 999px; background: var(--cream); color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 1rem; cursor: pointer; }
  .note { color: var(--muted); font-size: 0.85rem; }

  footer { background: var(--deep); border-top: 1px solid var(--line); padding: 48px var(--gutter); display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); font-size: 0.95rem; }
  footer h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 0 0 10px; }
  footer ul { list-style: none; padding: 0; margin: 0; }
  footer li { padding: 3px 0; }
  footer .form label, footer .form p:first-child { font-size: 0.9rem; }

  @media (max-width: 640px) {
    body { font-size: 17px; }
    .news-list li { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .embed iframe { height: 640px; }
  }
</style>
</head>
<body>
{{header}}
<main>
{{main}}
</main>
<footer>
{{footer}}
</footer>
<script>
  // Background videos only play while on screen, and not at all for visitors who prefer less motion.
  (function () {
    var vids = document.querySelectorAll(".bg-video");
    if (!vids.length) return;
    var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    vids.forEach(function (v) {
      if (still) { v.pause(); v.removeAttribute("autoplay"); return; }
      if (!("IntersectionObserver" in window)) return;
      new IntersectionObserver(function (e) { e[0].isIntersecting ? v.play().catch(function () {}) : v.pause(); }).observe(v);
    });
  })();
</script>
</body>
</html>
