name: Publish

# Builds the website from content/, checks it (every link, every old Squarespace address, each page
# in a browser) and publishes it with GitHub Pages. Runs on every push to main, every 15 minutes (to pick
# up edits made in the Drive kit) and on demand. A scheduled run with no Drive changes stops early.
# While the site is a preview (new.nonfictionhotlist.com) its pages tell search engines to skip them.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full: rebuild and publish. sync: publish only if Drive changed."
        type: choice
        options: [full, sync]
        default: full

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # On pushes (code and design changes), the kit tests run first; a failure stops the deploy.
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:kit
      - run: npm run test:kit:clean

  build:
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-24.04
    outputs:
      drive_failed: ${{ steps.pull.outcome == 'failure' }}
      publish: ${{ steps.decide.outputs.publish }}
      problems_changed: ${{ steps.pull2.outputs.problems_changed || steps.pull.outputs.problems_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the dashboard's "Changed" and "Recent changes" read the history
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # If Google can't be reached, the site still builds from the repo; the drive-error job reports it.
      - name: Pull text and images from the Drive kit
        id: pull
        continue-on-error: true
        run: node scripts/kit/pull-drive.js

      # Only when a new or replaced video is waiting: install ffmpeg (about a minute) and sync again,
      # which makes the video's web versions. Ordinary runs skip this.
      - name: Install ffmpeg for a new video
        if: steps.pull.outputs.videos_pending == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Pull again, making the video's web versions
        id: pull2
        if: steps.pull.outputs.videos_pending == 'true'
        run: node scripts/kit/pull-drive.js

      - name: Decide whether to publish
        id: decide
        run: |
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "sync" ]; } && [[ "${{ steps.pull.outputs.changed }}${{ steps.pull2.outputs.changed }}" != *true* ]] && [[ "${{ steps.pull.outputs.problems_changed }}${{ steps.pull2.outputs.problems_changed }}" != *true* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "No changes in Drive."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.decide.outputs.publish == 'true'
        run: npx playwright install --with-deps chromium
      - name: Build and check
        if: steps.decide.outputs.publish == 'true'
        run: npm run release

      - name: Commit changes from Drive
        if: steps.decide.outputs.publish == 'true'
        env:
          SUMMARY: ${{ steps.pull2.outputs.summary || steps.pull.outputs.summary }}
        run: |
          git add content
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update from Google Drive: ${SUMMARY}"
          git pull --rebase origin main
          git push origin HEAD:main

      - if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The Drive kit couldn't be read at all (Google down, the manifest unshared). The site was still built
  # from the repo; failing here sends the repo owner an email.
  drive-error:
    needs: build
    if: needs.build.outputs.drive_failed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "### The Drive kit couldn't be read" >> "$GITHUB_STEP_SUMMARY"
          echo "The site was published from the repo as it was. See the 'Pull text and images' step for the reason." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Edits that broke a rule were skipped (the site kept the previous text). Failing here sends the
  # repo owner an email, once each time the list changes.
  skipped-edits:
    needs: build
    if: needs.build.outputs.problems_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - run: |
          [ -s content/sync-problems.txt ] || { echo "No skipped edits."; exit 0; }
          { echo "### Edits skipped"; sed 's/^/- /' content/sync-problems.txt; } >> "$GITHUB_STEP_SUMMARY"
          cat content/sync-problems.txt; exit 1
